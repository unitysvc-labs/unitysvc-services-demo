name: Upload Data to Staging

# Thin caller — logic lives in the shared reusable workflow so a fix lands
# once for all unitysvc-services-* repos. See unitysvc-labs/.github.
#
# The reusable MUST live in the same org as this repo: GitHub only honours
# `secrets: inherit` within one organization. While this repo sat in the
# `unitysvc` org it had to call unitysvc/.github; back in unitysvc-labs it
# calls unitysvc-labs/.github like every other catalog repo.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  upload:
    uses: unitysvc-labs/.github/.github/workflows/seller-upload-staging.yml@main
    secrets: inherit
    permissions:
      contents: write
